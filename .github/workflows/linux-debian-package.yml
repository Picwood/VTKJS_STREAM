name: Linux Debian package
on:
  push:
    paths:
      - 'STL/**'
      - 'CaeGlobals/**'
      - 'CaeMesh/**'
      - 'CaeModel/**'
      - 'CaeJob/**'
      - 'CaeResults/**'
      - 'portable/**'
      - 'prototypes/VtkJsStreaming/**'
      - 'PrePoMax/main.ico'
      - 'LICENSE'
      - 'scripts/build-linux-viewer.sh'
      - 'scripts/linux-viewer-common.sh'
      - 'scripts/package-linux-deb.sh'
      - 'scripts/package-linux-viewer.sh'
      - 'scripts/start-gtk-viewer.py'
      - 'scripts/start-gtk-viewer.sh'
      - 'scripts/test-linux-deb-clean.sh'
      - '.github/workflows/linux-debian-package.yml'
  pull_request:
    paths:
      - 'STL/**'
      - 'CaeGlobals/**'
      - 'CaeMesh/**'
      - 'CaeModel/**'
      - 'CaeJob/**'
      - 'CaeResults/**'
      - 'portable/**'
      - 'prototypes/VtkJsStreaming/**'
      - 'PrePoMax/main.ico'
      - 'LICENSE'
      - 'scripts/build-linux-viewer.sh'
      - 'scripts/linux-viewer-common.sh'
      - 'scripts/package-linux-deb.sh'
      - 'scripts/package-linux-viewer.sh'
      - 'scripts/start-gtk-viewer.py'
      - 'scripts/start-gtk-viewer.sh'
      - 'scripts/test-linux-deb-clean.sh'
      - '.github/workflows/linux-debian-package.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: prototypes/VtkJsStreaming/src/client/package-lock.json
      - name: Install package-build validators
        run: sudo apt-get update && sudo apt-get install -y appstream desktop-file-utils
      - name: Build private-runtime viewer archive
        run: scripts/package-linux-viewer.sh "$RUNNER_TEMP/prepomax-linux-viewer.tar.gz"
      - name: Build reproducible Debian packages
        run: |
          scripts/package-linux-deb.sh --bundle "$RUNNER_TEMP/prepomax-linux-viewer.tar.gz" "$RUNNER_TEMP/prepomax-linux-viewer-a.deb"
          scripts/package-linux-deb.sh --bundle "$RUNNER_TEMP/prepomax-linux-viewer.tar.gz" "$RUNNER_TEMP/prepomax-linux-viewer-b.deb"
          cmp "$RUNNER_TEMP/prepomax-linux-viewer-a.deb" "$RUNNER_TEMP/prepomax-linux-viewer-b.deb"
          sha256sum "$RUNNER_TEMP/prepomax-linux-viewer-a.deb"
          base_version="$(dpkg-deb -f "$RUNNER_TEMP/prepomax-linux-viewer-a.deb" Version)"
          PREPOMAX_PACKAGE_VERSION="${base_version}.1" scripts/package-linux-deb.sh --bundle "$RUNNER_TEMP/prepomax-linux-viewer.tar.gz" "$RUNNER_TEMP/prepomax-linux-viewer-upgrade.deb"
      - name: Test clean Ubuntu 24.04 install, upgrade and purge
        run: scripts/test-linux-deb-clean.sh "$RUNNER_TEMP/prepomax-linux-viewer-a.deb" "$RUNNER_TEMP/prepomax-linux-viewer-upgrade.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: prepomax-linux-viewer-amd64
          path: ${{ runner.temp }}/prepomax-linux-viewer-a.deb
          if-no-files-found: error
